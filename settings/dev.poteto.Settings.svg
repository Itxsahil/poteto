<?xml version="1.0" encoding="UTF-8"?>
<!-- Poteto settings: a potato on a dark tile, with a switch turned on in its corner -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34363c"/>
      <stop offset="1" stop-color="#17181b"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.2" y1="0.1" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="0.55" stop-color="#e9a94c"/>
      <stop offset="1" stop-color="#b9762e"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="switch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b5e"/>
      <stop offset="1" stop-color="#e0352b"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- potato -->
  <g filter="url(#drop)">
    <path d="M30 66 C25 44 42 25 64 26 C87 27 100 43 97 62 C94 83 77 98 57 96 C41 94 33 82 30 66 Z"
          fill="url(#skin)"/>
    <path d="M30 66 C25 44 42 25 64 26 C87 27 100 43 97 62 C94 83 77 98 57 96 C41 94 33 82 30 66 Z"
          fill="url(#shine)"/>
    <!-- eyes -->
    <ellipse cx="50" cy="48" rx="3.2" ry="2.2" fill="#9a5e22" opacity="0.75" transform="rotate(-20 50 48)"/>
    <ellipse cx="73" cy="43" rx="2.6" ry="1.8" fill="#9a5e22" opacity="0.7" transform="rotate(15 73 43)"/>
    <ellipse cx="44" cy="72" rx="2.4" ry="1.7" fill="#9a5e22" opacity="0.65" transform="rotate(30 44 72)"/>
    <ellipse cx="66" cy="64" rx="2.2" ry="1.5" fill="#9a5e22" opacity="0.6"/>
  </g>

  <!-- switch, on -->
  <g filter="url(#drop)">
    <rect x="62" y="80" width="48" height="28" rx="14" fill="url(#switch)" stroke="#17181b" stroke-width="3"/>
    <circle cx="96" cy="94" r="10" fill="#ffffff"/>
  </g>
</svg>
