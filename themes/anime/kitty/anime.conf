# Anime - Kitty Terminal Theme
# Eldritch (github.com/eldritch-theme/kitty) by jacobrreed, see-through for this theme only.

# Only this theme sets it; every other theme falls back to the opaque 1.0 in kitty.conf.
# Live switching needs dynamic_background_opacity yes in kitty.conf.
background_opacity 0.85

# Background
background #212337

# Foreground
foreground #ebfafa

# Cursor
cursor #37f499
cursor_text_color #212337

# Selection
selection_background #bf4f8e
selection_foreground #ebfafa

# Tab bar
tab_bar_background #212337
active_tab_background #37f499
active_tab_foreground #212337
inactive_tab_background #323449
inactive_tab_foreground #ebfafa

# Window borders
active_border_color #37f499
inactive_border_color #7081d0
bell_border_color #f7c67f

# Normal colors
color0 #21222c
color1 #f9515d
color2 #37f499
color3 #e9f941
color4 #9071f4
color5 #f265b5
color6 #04d1f9
color7 #ebfafa

# Bright colors
color8 #7081d0
color9 #f16c75
color10 #69f8b2
color11 #f1fc79
color12 #a48cf2
color13 #fd92ce
color14 #66e4fd
color15 #ffffff

# Underline
url_color #04d1f9
