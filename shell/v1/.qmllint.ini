; Settings for Qt 6's qmllint (/usr/lib/qt6/bin/qmllint, not /usr/bin/qmllint, which is Qt 5's).
; Run through tools/check, which also needs .qmlls.ini (written by Quickshell, not tracked) for
; the import paths, and compares against tools/qmllint-baseline.txt.
[Warnings]
; Quickshell's PanelWindow is created everywhere; its type info calls it uncreatable
UncreatableType=disable
; Style: reaching an outer item's members without naming it. Shown, not counted; to be cleaned up
; file by file (CLAUDE.md, QML rules)
UnqualifiedAccess=info
UnusedImports=warning
